name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests and checksums (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Unit tests (all HTTP mocked)
        run: python -m pytest -m "not live"
      - name: Verify checksums of every reference run and cached API response
        run: python scripts/verify_checksums.py --all

  reproduce:
    # The reference runs were made on Windows; reproduction is checked on the same platform.
    name: Reproduce reference analyses offline
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
      - name: Oxidative stress, Phase 2 offline
        shell: bash
        run: |
          python -m extremonet.analysis --config config/phase2_analysis.yaml --mode offline
          python scripts/check_reproduction.py results/phase2/20261103T111919Z_860ea5376e14 \
            "results/phase2/$(cat results/phase2/LATEST_RUN.txt)"
      - name: DNA repair, Phase 2 offline
        if: success() || failure()
        shell: bash
        run: |
          python -m extremonet.analysis --config config/phase2_dna_repair.yaml --mode offline
          python scripts/check_reproduction.py results/dna_repair/phase2/20261103T112433Z_73788e2787df \
            "results/dna_repair/phase2/$(cat results/dna_repair/phase2/LATEST_RUN.txt)"
      - name: Keep the re-run outputs if a check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproduction-runs
          path: |
            results/phase2/2026*/
            results/dna_repair/phase2/2026*/
          retention-days: 14
