[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "extremonet"
version = "0.3.0"
description = "Cross-species network analysis of oxidative-stress and DNA-repair proteins in Deinococcus radiodurans and Homo sapiens, with evidence-graded ranking of candidate functional analogues."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ananthapadmanabhan" }]
keywords = ["protein networks", "network alignment", "functional analogy", "Deinococcus radiodurans",
            "oxidative stress", "DNA repair", "STRING", "reproducibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "networkx==3.4.2",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "PyYAML==6.0.2",
    "requests==2.32.3",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
]

[project.urls]
Repository = "https://github.com/Ananthapadmanabhan333/Cross-Species-Oxidative-States-"
Issues = "https://github.com/Ananthapadmanabhan333/Cross-Species-Oxidative-States-/issues"

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[project.scripts]
extremonet = "extremonet.cli:main"
extremonet-analysis = "extremonet.analysis.cli:main"

# The repository keeps the requested top-level layout (src/data_collection, src/quality_control, ...)
# while exposing it as the importable package `extremonet`.
[tool.setuptools]
package-dir = { "extremonet" = "src" }
packages = [
    "extremonet",
    "extremonet.data_collection",
    "extremonet.preprocessing",
    "extremonet.network_construction",
    "extremonet.quality_control",
    "extremonet.annotation",
    "extremonet.analysis",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test temp files go in the project folder (gitignored) instead of the system temp dir on C:.
addopts = "-ra --basetemp=.pytest_tmp"
markers = [
    "live: tests that contact real web APIs (deselected by default; run with -m live)",
]
